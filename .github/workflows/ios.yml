name: iOS build

on:
  push:
    branches: [ "claude/**", "main" ]
    paths: [ "ios/**", ".github/workflows/ios.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Flowfy.xcodeproj -scheme Flowfy -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Flowfy.app
      - name: Show errors
        if: failure()
        working-directory: ios
        run: grep -E "error:" build.log | head -150 || true
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Flowfy.app Payload/
          zip -qry Flowfy.ipa Payload
          ls -la Flowfy.ipa
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: Flowfy iOS build ${{ github.run_number }}
          prerelease: true
          files: ios/Flowfy.ipa
