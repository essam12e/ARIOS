name: Flowfy
options:
  bundleIdPrefix: com.bablo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Flowfy:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Flowfy
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Flowfy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio, fetch]
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIAppFonts: [plex_arabic_semibold.ttf]
        NSAppleMusicUsageDescription: "فلوفاي يحتاج الوصول لمكتبة الموسيقى لتشغيل أغانيك المحمّلة على الجهاز."
        NSPhotoLibraryUsageDescription: "لحفظ بطاقات وفيديوهات الكلمات في الصور."
        NSPhotoLibraryAddUsageDescription: "لحفظ بطاقات وفيديوهات الكلمات في الصور."
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mp3, public.mpeg-4-audio, org.xiph.flac]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bablo.flowfy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
